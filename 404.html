<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Farmer Mobile</title>
    <base href="/FarmerMobileApp/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css?v=11.2.8-fix1">
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="images/extension-loading-mark.png" />
</head>

<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center vh-100" style="background: #0f172a; color: white;">
            <div class="text-center extension-loading-content">
                <img class="extension-loading-mark" src="images/extension-loading-mark.png" alt="" aria-hidden="true" />
                <h5 class="mt-3 mb-1 fw-bold">Farmer Mobile</h5>
                <p class="small mb-0 extension-loading-status"><span class="extension-loading-dot"></span>Connecting to farm operations</p>
                <span class="visually-hidden">Loading the farmer operations workspace</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js?v=11.2.8-fix1"></script>
    <script src="js/radzen-compat.js?v=11.2.8-fix1"></script>
</body>

</html>
